name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests, X11 end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the exact candidate SHA rather than GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install tesseract and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr xvfb fonts-noto-cjk

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j1 -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked -j1 -- --test-threads=1

      - name: Build GUI
        run: cargo build --locked -j1 -p screensense-gui

      - name: GUI rendering and safe interactions (isolated Xvfb window)
        env:
          SCREENSENSE_NO_SCREEN: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" target/debug/screensense-gui --verify-native "$RUNNER_TEMP/gui-native-fixture"

      - name: GUI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-verification
          path: |
            ${{ runner.temp }}/gui-native-fixture/*.png
            ${{ runner.temp }}/gui-native-fixture/verification.json
          if-no-files-found: warn

      # Three tests need a real X server. Without SCREENSENSE_X11_TEST=1 the
      # first two return early, which is why `cargo test --workspace --locked -j1 -- --test-threads=1` above
      # passes on a machine without a display; the third skips itself when
      # Xvfb or the demo window is missing. A skipped test counts as passed
      # by cargo, so each step below also fails when the log says "skipped"
      # or when no test ran.
      - name: Build the demo window
        run: cargo build --locked -j1 -p screensense-platform --example demo_window

      # Platform backend: window list, capture, OCR and private-browsing
      # answer against the demo window, plus a reconnect test.
      - name: X11 backend end to end (Xvfb)
        shell: bash
        env:
          SCREENSENSE_X11_TEST: "1"
        run: |
          log="$RUNNER_TEMP/x11-platform.log"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo test --locked -j1 -p screensense-platform --test x11_e2e -- --nocapture --test-threads=1 \
            2>&1 | tee "$log"
          if grep -Eqi 'skipped' "$log"; then echo "::error::an X11 test was skipped"; exit 1; fi
          if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed' "$log"; then echo "::error::no X11 test ran"; exit 1; fi

      # Daemon: the real sensor, capture and housekeeping threads against the
      # demo window; checks the span, the stored frame and image, the error
      # row and a clean stop.
      - name: Daemon end to end (Xvfb)
        shell: bash
        env:
          SCREENSENSE_X11_TEST: "1"
        run: |
          log="$RUNNER_TEMP/x11-daemon.log"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo test --locked -j1 -p screensense daemon::tests::x11_end_to_end -- --nocapture --test-threads=1 \
            2>&1 | tee "$log"
          if grep -Eqi 'skipped' "$log"; then echo "::error::the daemon test was skipped"; exit 1; fi
          if ! grep -Eq '^test result: ok\. 1 passed' "$log"; then echo "::error::the daemon test did not run"; exit 1; fi

      # CLI: `doctor --capture` against Xvfb (an ordinary window is captured,
      # a window the rules hide is not). This test is not gated by an
      # environment variable and starts its own Xvfb on display :300 or
      # higher; xvfb-run is only here to match the other steps.
      - name: doctor --capture end to end (Xvfb)
        shell: bash
        run: |
          log="$RUNNER_TEMP/x11-cli.log"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo test --locked -j1 -p screensense --test cli x11:: -- --nocapture --test-threads=1 \
            2>&1 | tee "$log"
          if grep -Eqi 'skipped' "$log"; then echo "::error::the doctor --capture test was skipped"; exit 1; fi
          if ! grep -Eq '^test result: ok\. 1 passed' "$log"; then echo "::error::the doctor --capture test did not run"; exit 1; fi

  windows:
    name: Windows (clippy, tests, smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the exact candidate SHA rather than GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j1 -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked -j1 -- --test-threads=1

      - name: Build GUI
        run: cargo build --locked -j1 -p screensense-gui

      - name: GUI software rendering and safe interactions (isolated)
        env:
          SCREENSENSE_NO_SCREEN: "1"
        run: target\debug\screensense-gui.exe --verify-ui "$env:RUNNER_TEMP\gui-software-fixture"

      - name: GUI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-verification
          path: |
            ${{ runner.temp }}/gui-software-fixture/*.png
            ${{ runner.temp }}/gui-software-fixture/verification.json
          if-no-files-found: warn

      # Only the self-owned nonactivating fixture is rendered. Headless runner
      # limitations remain visible as a failed optional step, never a native pass.
      - name: Native Windows fixture capture and OCR (requires desktop support)
        continue-on-error: true
        run: cargo test --locked -j1 -p screensense-platform windows_fixture_capture_and_ocr -- --ignored --nocapture --test-threads=1

      - name: Native Windows OCR from in-memory synthetic text (requires OCR language)
        continue-on-error: true
        run: cargo test --locked -j1 -p screensense-platform windows_synthetic_ocr -- --ignored --nocapture --test-threads=1

      - name: Build smoke binary
        run: cargo build --release --locked -j1 -p screensense

      - name: "Smoke: doctor (observation disabled)"
        env:
          SCREENSENSE_NO_SCREEN: "1"
        run: target\release\screensense.exe doctor

      - name: "Smoke: config check"
        run: target\release\screensense.exe config check

      # The script must at least parse, in PowerShell 7 and in Windows
      # PowerShell 5.1. This step fails the job if it does not.
      - name: "Smoke: shell-init powershell parses (PowerShell 7)"
        shell: pwsh
        run: |
          $script = & target\release\screensense.exe shell-init powershell | Out-String
          if ($LASTEXITCODE -ne 0) { throw "shell-init powershell exited with $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($script)) { throw "shell-init powershell printed nothing" }
          [scriptblock]::Create($script) | Out-Null
          Write-Host "parsed $($script.Length) characters"

      - name: "Smoke: shell-init powershell parses (Windows PowerShell 5.1)"
        shell: powershell
        run: |
          $script = & target\release\screensense.exe shell-init powershell | Out-String
          if ($LASTEXITCODE -ne 0) { throw "shell-init powershell exited with $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($script)) { throw "shell-init powershell printed nothing" }
          [scriptblock]::Create($script) | Out-Null
          Write-Host "parsed $($script.Length) characters"

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the exact candidate SHA rather than GitHub's synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@1.89

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked -j1
