name: Release

# Pushing a tag such as v0.1.0 builds both archives and publishes a GitHub
# release. Running the workflow by hand builds the same archives and keeps
# them as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # An older Ubuntu, so the binary needs an older glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -j1 -p screensense --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "screensense-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/screensense.exe" "dist/$name/"
          Copy-Item README.md, README.zh-TW.md, LICENSE, THIRD-PARTY-NOTICES.md, SECURITY.md, CHANGELOG.md, install.ps1, install.sh "dist/$name/"
          Copy-Item docs "dist/$name/docs" -Recurse
          New-Item -ItemType Directory -Force -Path "dist/$name/skills/screen" | Out-Null
          Copy-Item skills/screen/SKILL.md "dist/$name/skills/screen/"
          cargo metadata --format-version 1 --locked --filter-platform '${{ matrix.target }}' | Set-Content dist/dependency-metadata.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "dependency metadata failed" }
          python scripts/collect_licenses.py dist/dependency-metadata.json "dist/$name/LICENSES"
          if ($LASTEXITCODE -ne 0) { throw "dependency license collection failed" }
          $version = (& "target/${{ matrix.target }}/release/screensense.exe" --version) -replace '^screensense\s+', ''
          if ($LASTEXITCODE -ne 0) { throw "binary version check failed" }
          "commit=${{ github.sha }}`nversion=$version`nref=${{ github.ref_name }}`ntarget=${{ matrix.target }}`nsignature=unsigned" | Set-Content "dist/$name/BUILD-INFO.txt" -Encoding utf8
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          name="screensense-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/screensense" "dist/$name/"
          cp README.md README.zh-TW.md LICENSE THIRD-PARTY-NOTICES.md SECURITY.md CHANGELOG.md install.ps1 install.sh "dist/$name/"
          cp -R docs "dist/$name/docs"
          mkdir -p "dist/$name/skills/screen"
          cp skills/screen/SKILL.md "dist/$name/skills/screen/"
          cargo metadata --format-version 1 --locked --filter-platform '${{ matrix.target }}' > dist/dependency-metadata.json
          python3 scripts/collect_licenses.py dist/dependency-metadata.json "dist/$name/LICENSES"
          version=$("target/${{ matrix.target }}/release/screensense" --version | cut -d ' ' -f 2)
          printf 'commit=%s\nversion=%s\nref=%s\ntarget=%s\nsignature=unsigned\n' '${{ github.sha }}' "$version" '${{ github.ref_name }}' '${{ matrix.target }}' > "dist/$name/BUILD-INFO.txt"
          tar -C "dist/$name" -czf "dist/$name.tar.gz" .

      # Extract the actual archive into a path with spaces and exercise only
      # isolated CLI/history/MCP fixtures. Never observe the runner's desktop.
      - name: Clean archive smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/release_smoke.py "dist/screensense-${{ matrix.target }}.zip" --commit "${{ github.sha }}" --output "dist/package-smoke-${{ matrix.target }}.json"

      - name: Clean archive smoke (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/release_smoke.py "dist/screensense-${{ matrix.target }}.tar.gz" --commit "${{ github.sha }}" --output "dist/package-smoke-${{ matrix.target }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: screensense-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/package-smoke-*.json
          if-no-files-found: error

  publish:
    name: Checksums and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum screensense-*.zip screensense-*.tar.gz package-smoke-*.json > SHA256SUMS
          cat SHA256SUMS

      # Manual runs: keep everything as one artifact, publish nothing.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: screensense-release-files
          path: dist/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/screensense-*.zip
            dist/screensense-*.tar.gz
            dist/package-smoke-*.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: docs/RELEASE-NOTES.md
