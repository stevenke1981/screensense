[package]
name = "screensense-gui"
description = "GNOME-inspired desktop controls for ScreenSense"
version.workspace = true
edition.workspace = true
# Slint 1.18 (system tray) needs Rust 1.92; the other crates keep 1.89.
rust-version = "1.92"
license = "GPL-3.0-only"
repository.workspace = true
build = "build.rs"

[dependencies]
screensense-core.workspace = true
screensense-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "system-tray", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
