[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/cli", "crates/gui"]
default-members = ["crates/core", "crates/platform", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/stevenke1981/screensense"
authors = ["stevenke1981"]

[workspace.dependencies]
screensense-core = { path = "crates/core" }
screensense-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.clippy]
# Added in clippy 1.99. `chunks_exact(4)` over pixel buffers is clear as written.
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
